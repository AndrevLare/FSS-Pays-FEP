<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resultado del pago — Uniformes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --font-display: "Fraunces", serif;
        --font-body: "Instrument Sans", sans-serif;

        --navy: #16233d;
        --accent: #c2703d;
        --accent-dark: #8a4c26;
        --accent-soft: #f3e3d3;
        --success: #2f7d5f;
        --success-soft: #e4f1ec;
        --danger: #c0392b;
        --danger-soft: #fbeae7;
        --pending: #b45309;
        --pending-soft: #fdf1de;

        --bg: #f6f3ec;
        --surface: #ffffff;
        --border: #e5ded0;
        --text: #211d18;
        --muted: #6b6459;
      }

      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 16px 60px;
      }

      .wrap {
        max-width: 460px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .icon-circle {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        margin: 0 auto 6px;
      }
      .icon-circle.success {
        background: var(--success-soft);
      }
      .icon-circle.error {
        background: var(--danger-soft);
      }
      .icon-circle.pending {
        background: var(--pending-soft);
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 34px 26px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(33, 29, 24, 0.04), 0 8px 24px -14px rgba(33, 29, 24, 0.14);
      }

      .card h1 {
        font-family: var(--font-display);
        font-size: 23px;
        font-weight: 700;
        color: var(--navy);
        margin-bottom: 10px;
      }

      .card p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.6;
      }

      .ref-box {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 16px;
        margin-top: 22px;
        font-size: 13px;
        color: var(--muted);
      }
      .ref-box strong {
        display: block;
        font-size: 15px;
        color: var(--text);
        margin-top: 4px;
        letter-spacing: 0.03em;
      }

      .badge-status {
        display: inline-block;
        padding: 5px 14px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-top: 16px;
      }
      .badge-status.success {
        background: var(--success-soft);
        color: var(--success);
      }
      .badge-status.error {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .badge-status.pending {
        background: var(--pending-soft);
        color: var(--pending);
      }

      .btn-back {
        display: block;
        text-align: center;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 14px;
        min-height: 48px;
        font-size: 15px;
        font-weight: 700;
        font-family: var(--font-body);
        text-decoration: none;
        transition: background 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-back:hover {
        background: var(--accent-dark);
      }

      .nota {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" id="result-card">
        <div class="icon-circle" id="icon"></div>
        <h1 id="titulo"></h1>
        <p id="mensaje"></p>
        <span class="badge-status" id="badge"></span>
        <div class="ref-box" id="ref-box" style="display: none">
          Referencia del pedido
          <strong id="ref-value"></strong>
        </div>
      </div>

      <a href="index.html" class="btn-back">Volver al formulario</a>
      <p class="nota">Si tienes dudas, contacta a la institución educativa.</p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      // Bold redirige con: ?bold-order-id=...&bold-tx-status=approved
      const status = (params.get("bold-tx-status") || "").toUpperCase();
      const reference = params.get("bold-order-id") || "";

      const icon = document.getElementById("icon");
      const titulo = document.getElementById("titulo");
      const mensaje = document.getElementById("mensaje");
      const badge = document.getElementById("badge");
      const refBox = document.getElementById("ref-box");
      const refVal = document.getElementById("ref-value");

      if (status === "APPROVED") {
        icon.textContent = "✅";
        icon.className = "icon-circle success";
        titulo.textContent = "¡Gracias por tu compra!";
        mensaje.textContent =
          "Tu pago fue procesado exitosamente. Pronto la institución educativa confirmará los detalles de tu pedido.";
        badge.textContent = "Pago aprobado";
        badge.className = "badge-status success";
      } else if (
        status === "REJECTED" ||
        status === "FAILED" ||
        status === "ERROR"
      ) {
        icon.textContent = "❌";
        icon.className = "icon-circle error";
        titulo.textContent = "El pago no fue completado";
        mensaje.textContent =
          "Tu transacción fue rechazada o cancelada. Puedes intentarlo de nuevo con otro método de pago.";
        badge.textContent = "Pago rechazado";
        badge.className = "badge-status error";
      } else if (status === "PENDING") {
        icon.textContent = "⏳";
        icon.className = "icon-circle pending";
        titulo.textContent = "Pago en proceso";
        mensaje.textContent =
          "Tu pago está siendo verificado (algunos métodos, como PSE, tardan unos minutos). Guarda tu referencia por si necesitas consultar el estado.";
        badge.textContent = "Pendiente";
        badge.className = "badge-status pending";
      } else {
        icon.textContent = "🧾";
        icon.className = "icon-circle pending";
        titulo.textContent = "Pedido recibido";
        mensaje.textContent =
          "Estamos confirmando el estado de tu pago. Si tienes dudas, contacta a la institución educativa con tu referencia de pedido.";
        badge.textContent = "En revisión";
        badge.className = "badge-status pending";
      }

      if (reference) {
        refBox.style.display = "block";
        refVal.textContent = reference;
      }
    </script>
  </body>
</html>
